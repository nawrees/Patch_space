server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API proxy — the browser never sees the backend as a
    # separate origin, which removes CORS and CSP connect-src concerns for
    # the frontend's own API calls entirely (both matter only for
    # cross-origin requests). `backend` resolves via Docker's internal DNS
    # since both services share the `patchspace` network in
    # docker-compose.yml. Backend's app.js trusts this one proxy hop
    # (`trust proxy`, 1) so req.ip still reflects the real client.
    location /api {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: Angular's client-side router needs every unknown path to
    # resolve to index.html, otherwise a refresh or deep link on any route
    # other than "/" 404s at the nginx level before Angular ever loads.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|woff2?|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        access_log off;
    }
}
