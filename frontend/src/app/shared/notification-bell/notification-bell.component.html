<div class="nb-wrap" (click)="$event.stopPropagation()">

  <!-- Bell button -->
  <button class="nb-btn" (click)="toggle($event)" [class.nb-active]="open" title="Notifications">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 10-12 0v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
    </svg>
    <span class="nb-badge" *ngIf="unreadCount > 0">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
  </button>

  <!-- Dropdown -->
  <div class="nb-dropdown" [class.nb-open]="open">

    <div class="nb-header">
      <span class="nb-title">Notifications</span>
      <button class="nb-mark-all" *ngIf="unreadCount > 0" (click)="markAllRead($event)">
        Mark all read
      </button>
    </div>

    <!-- Empty state -->
    <div class="nb-empty" *ngIf="notifications.length === 0">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 10-12 0v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
      </svg>
      <p>No notifications yet</p>
    </div>

    <!-- List -->
    <div class="nb-list" *ngIf="notifications.length > 0">
      <div
        class="nb-item"
        *ngFor="let n of notifications"
        [class.nb-unread]="!n.is_read"
        (click)="onNotificationClick(n)"
      >
        <div class="nb-icon-col">
          <span class="nb-type-icon" [class.nb-icon-asked]="n.type === 'question_asked'" [class.nb-icon-answered]="n.type === 'question_answered'">
            <app-icon [name]="n.type === 'question_asked' ? 'help-circle' : 'check-circle'" [size]="16"></app-icon>
          </span>
        </div>
        <div class="nb-body">
          <p class="nb-msg">{{ n.message }}</p>
          <span class="nb-time">{{ timeAgo(n.created_at) }}</span>
        </div>
        <div class="nb-dot" *ngIf="!n.is_read"></div>
      </div>
    </div>

  </div>
</div>
