name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch/PR cancels whatever run was already in
# progress for it — no point finishing CI for a commit that's already been
# superseded. Scoped by github.ref (not just the workflow name) so this
# never cancels a run on an unrelated branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 0 — scans the diff for accidentally-committed secrets (API keys,
  # tokens, private keys) before anything else runs. Free for public repos
  # (this one is public) — no license key needed.
  secret-scan:
    name: "Stage 0 — Secret Scanning"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-typecheck:
    name: "Stage 1 — Frontend Type-check"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Stage placeholder environment files
        working-directory: frontend
        run: |
          cp src/environments/environment.example.ts src/environments/environment.ts
          cp src/environments/environment.prod.example.ts src/environments/environment.prod.ts
      - working-directory: frontend
        run: npm run typecheck

  frontend-lint:
    name: "Stage 1 — Frontend Lint"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Stage placeholder environment files
        working-directory: frontend
        run: |
          cp src/environments/environment.example.ts src/environments/environment.ts
          cp src/environments/environment.prod.example.ts src/environments/environment.prod.ts
      - working-directory: frontend
        run: npm run lint

  backend-lint:
    name: "Stage 1 — Backend Lint"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm run lint

  backend-test:
    name: "Stage 2 — Backend Unit Tests"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm test

  migration-check:
    name: "Stage 1 — Migration Check"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node database/scripts/check-migrations.mjs

  # Purely a graph-shape fix: without this, Stage 1's four jobs and Stage 2
  # (backend-test) share an identical upstream (secret-scan) AND downstream
  # (ci-passed), so GitHub's workflow graph merges all five into one
  # indistinguishable cluster instead of two visibly separate branches.
  # Giving Stage 1 its own distinct successor here makes secret-scan fan out
  # into two clearly separate paths. No if: always() needed — a job with no
  # explicit needs.*.result gets skipped automatically if any of its needs
  # failed, and ci-passed's own skipped-check below already treats that as
  # a failure.
  stage1-complete:
    name: "Stage 1 — All Checks Passed"
    runs-on: ubuntu-latest
    needs: [frontend-typecheck, frontend-lint, backend-lint, migration-check]
    steps:
      - run: echo "Stage 1 checks passed"

  # Matching checkpoint for Stage 2, purely so both branches have equal
  # depth from secret-scan (2 hops to their own checkpoint, 1 more to
  # ci-passed) instead of backend-test being one hop shorter than Stage 1 —
  # that depth mismatch was making GitHub's graph draw backend-test's edge
  # to ci-passed as if it passed through/connected to stage1-complete.
  stage2-complete:
    name: "Stage 2 — All Checks Passed"
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - run: echo "Stage 2 checks passed"

  # Single stable name to require in branch protection instead of listing
  # every job individually (which silently stops blocking merges if one
  # ever gets renamed). Needs if: always() — otherwise this job would just
  # be skipped (not failed) whenever a dependency fails, which GitHub does
  # NOT treat as a blocking result for required status checks. The check
  # below also treats 'skipped' as a failure: if secret-scan fails, every
  # Stage 1/2 job below it gets skipped rather than failed, and that must
  # still block the gate.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [stage1-complete, stage2-complete]
    if: always()
    steps:
      - name: Check all required jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] \
             || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ] \
             || [ "${{ contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more required checks did not pass."
            exit 1
          fi
          echo "All required checks passed."

  # Stage 3 — validates the app actually compiles for production (Angular's
  # real AOT template type-checking + bundle-size budgets from angular.json)
  # — a stricter pass than typecheck/lint catch on their own. No deploy:
  # this only proves the build succeeds, nothing is uploaded or shipped.
  frontend-build:
    name: "Stage 3 — Frontend Build"
    runs-on: ubuntu-latest
    needs: ci-passed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Stage placeholder environment files
        working-directory: frontend
        run: |
          cp src/environments/environment.example.ts src/environments/environment.ts
          cp src/environments/environment.prod.example.ts src/environments/environment.prod.ts
      - working-directory: frontend
        run: npm run build

  # Stage 4 — scans the actual built Docker images for known CVEs in their
  # OS-level packages (openssl, libc, etc. baked into node:22-alpine /
  # nginx:1.27-alpine) — a gap nothing else here covers: Dependabot only
  # sees npm packages, Wazuh's vulnerability-detection only sees the VM
  # host's own OS packages, neither looks inside an image's own filesystem.
  # Deliberately NOT wired into ci-passed / branch protection yet —
  # exit-code 0 means this only reports (via GitHub's Security tab), never
  # blocks a merge, until there's been a real baseline to see what these
  # base images actually contain and decide what severity should gate.
  backend-image-scan:
    name: "Stage 4 — Backend Image Scan"
    runs-on: ubuntu-latest
    needs: ci-passed
    # security-events: write is required by upload-sarif — the default
    # GITHUB_TOKEN doesn't grant this on its own; without it the upload
    # step fails outright with "Resource not accessible by integration"
    # (confirmed: this is exactly what happened on the first real run).
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t backend-image:scan ./backend
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: backend-image:scan
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

  frontend-image-scan:
    name: "Stage 4 — Frontend Image Scan"
    runs-on: ubuntu-latest
    needs: ci-passed
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend image
        run: |
          docker build -t frontend-image:scan \
            --build-arg SUPABASE_URL=https://dummy-test.supabase.co \
            --build-arg SUPABASE_ANON_KEY=dummy-anon \
            ./frontend
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: frontend-image:scan
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  # Stage 4 — static analysis of our OWN source (backend/src, backend/tests,
  # frontend/src) for real code-level bugs, security hotspots, and code
  # smells. This is a different gap than everything else here: ESLint only
  # catches style/basic-correctness, Trivy/Dependabot only scan OS packages
  # and npm dependency versions, nothing else looks for vulnerability
  # patterns inside the app code we actually write. Deliberately not wired
  # into ci-passed yet — same reasoning as the image scans: needs a real
  # baseline first before any quality gate should be allowed to block merges.
  sonarcloud:
    name: "Stage 4 — SonarCloud Analysis"
    runs-on: ubuntu-latest
    needs: ci-passed
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud's new-code/blame analysis needs real history, not the
          # default shallow clone.
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
