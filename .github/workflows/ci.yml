name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Stage placeholder environment files
        working-directory: frontend
        run: |
          cp src/environments/environment.example.ts src/environments/environment.ts
          cp src/environments/environment.prod.example.ts src/environments/environment.prod.ts
      - working-directory: frontend
        run: npm run typecheck

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Stage placeholder environment files
        working-directory: frontend
        run: |
          cp src/environments/environment.example.ts src/environments/environment.ts
          cp src/environments/environment.prod.example.ts src/environments/environment.prod.ts
      - working-directory: frontend
        run: npm run lint

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm run lint

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm test

  migration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node database/scripts/check-migrations.mjs

  # Single stable name to require in branch protection instead of listing
  # all four jobs individually (which silently stops blocking merges if one
  # ever gets renamed). Needs if: always() — otherwise this job would just
  # be skipped (not failed) whenever a dependency fails, which GitHub does
  # NOT treat as a blocking result for required status checks.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [frontend-typecheck, frontend-lint, backend-lint, backend-test, migration-check]
    if: always()
    steps:
      - name: Check all required jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required checks did not pass."
            exit 1
          fi
          echo "All required checks passed."

  # Validates the app actually compiles for production (Angular's real AOT
  # template type-checking + bundle-size budgets from angular.json) — a
  # stricter pass than typecheck/lint catch on their own. No deploy: this
  # only proves the build succeeds, nothing is uploaded or shipped anywhere.
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: ci-passed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Stage placeholder environment files
        working-directory: frontend
        run: |
          cp src/environments/environment.example.ts src/environments/environment.ts
          cp src/environments/environment.prod.example.ts src/environments/environment.prod.ts
      - working-directory: frontend
        run: npm run build
