version: 2
updates:
  # Minor/patch bumps are grouped into one weekly PR per ecosystem to avoid
  # PR spam across ~1000 frontend + ~275 backend packages. Major bumps (more
  # likely to be breaking) still get their own individual PR for visibility.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Angular's own packages must be upgraded together in lockstep via
      # `ng update` (which also runs migration schematics) — Dependabot
      # bumping one independently of the others (e.g. @angular/forms to 22
      # while @angular/core stays on 18) always breaks with an ERESOLVE
      # peer-dependency conflict. Confirmed repeatedly in practice: every
      # single CI failure from an open Dependabot PR traced back to one of
      # these packages. A real Angular major upgrade is a deliberate manual
      # `ng update` process, not something to automate here.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "angular-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # zone.js's versioning tracks Angular's major version directly rather
      # than independent semver — even a "minor" 0.14.x -> 0.16.x bump
      # broke Angular 18 in practice. Ignored entirely, not just majors.
      - dependency-name: "zone.js"

  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
