sonar.projectKey=nawrees_Patch_space
sonar.organization=nawrees

sonar.sources=backend/src,frontend/src,database/scripts
sonar.exclusions=**/node_modules/**,frontend/dist/**,frontend/.angular/**
sonar.sourceEncoding=UTF-8

# Spec/test files live alongside source (frontend/src/**/*.spec.ts) or in
# their own folder (backend/tests) — both are declared here as tests, not
# main sources, so they're analyzed as test code and aren't held to the
# same coverage requirement as the production code they exercise.
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.js
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.js

# Coverage from both sides (npm run test:coverage in each — frontend via
# jest.config.js, backend via Node's built-in --experimental-test-coverage
# + its lcov test reporter, see backend/package.json).
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info

# Blocks this CI step until SonarCloud has actually computed the Quality
# Gate result (not just accepted the upload), so a real gate failure fails
# the job — this is what lets ci.yml require the sonarcloud job.
sonar.qualitygate.wait=true
