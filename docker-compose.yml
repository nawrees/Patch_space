services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      # Bind-mounts the HOST's Docker socket so the backend can orchestrate
      # student lab containers as siblings on the same engine — the same
      # pattern docker.service.js already assumes (it auto-detects
      # /var/run/docker.sock on Linux). No Docker-in-Docker here.
      - /var/run/docker.sock:/var/run/docker.sock
      # Stable host path for the rotating access log (see app.js) — Docker's
      # own default log location embeds the container ID, which changes on
      # every deploy, making it useless as a fixed target for Wazuh to watch.
      - ./backend/logs:/app/logs
    env_file:
      - .env
    networks:
      - patchspace

  frontend:
    build:
      context: ./frontend
      # Real values are read from the root .env file (docker compose
      # substitutes ${VAR} in this file from .env automatically) and baked
      # into the compiled bundle at build time by write-env.mjs. Neither of
      # these is a sensitive secret — SUPABASE_ANON_KEY is designed to be
      # public; RLS is the real security boundary, same as every other
      # client-side use of it in this app. No API_URL arg — nginx proxies
      # /api to the backend service on the same origin (see
      # frontend/nginx.conf), so the frontend never needs to know the
      # deployment's specific host/IP at all.
      args:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - patchspace

networks:
  patchspace:
    driver: bridge
